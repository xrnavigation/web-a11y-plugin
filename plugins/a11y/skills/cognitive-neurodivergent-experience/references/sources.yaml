  - id: w3c-wai-user-stories
    title: "Stories of Web Users — How People with Disabilities Use the Web"
    url: https://www.w3.org/WAI/people-use-web/user-stories/
    publisher: W3C WAI
    used_for: "Personas (Ian, Stefan, Sophie)"

