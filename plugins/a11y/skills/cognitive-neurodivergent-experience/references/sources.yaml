# Sources for cognitive-neurodivergent-experience skill
# All claims in the skill and reference files are traced to these sources

primary_research:
  - id: wcag-com-neurodiversity
    title: "Digital Accessibility and Neurodiversity"
    url: https://www.wcag.com/blog/digital-accessibility-and-neurodiversity/
    publisher: WCAG.com
    used_for: "Prevalence data (15-20% neurodivergent)"

  - id: w3c-coga-usable
    title: "Making Content Usable for People with Cognitive and Learning Disabilities"
    url: https://www.w3.org/TR/coga-usable/
    publisher: W3C
    type: W3C Working Group Note
    used_for: "COGA framework, design objectives, personas, plain language guidance"

  - id: w3c-coga-data-loss
    title: "Avoid Data Loss and Timeouts — COGA Design Pattern"
    url: https://www.w3.org/WAI/WCAG2/supplemental/patterns/o4p09-data-loss/
    publisher: W3C WAI
