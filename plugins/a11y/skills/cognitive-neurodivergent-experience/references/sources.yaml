  - id: w3c-cognitive-accessibility
    title: "Cognitive Accessibility at W3C"
    url: https://www.w3.org/WAI/cognitive/
    publisher: W3C WAI
    used_for: "COGA design objectives overview"

  - id: w3c-coga-dyscalculia
    title: "Gap Analysis: Dyscalculia"
