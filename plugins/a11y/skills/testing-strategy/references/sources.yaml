sources:
- name: 'Deque: Automated Testing Study Identifies 57% of Digital Accessibility Issues'
  url: https://www.deque.com/blog/automated-testing-study-identifies-57-percent-of-digital-accessibility-issues/
  type: industry-study
  accessed: '2026-03-27'
  sections_used:
  - 57% of issues detectable by automation
  - Seven criteria account for 80% of issues
  - Contrast alone is ~30% of all issues
  - Intelligent Guided Tests increase coverage to ~80%
- name: 'Accessible.org: Automated Scans Reliably Flag 13% of WCAG Criteria'
  url: https://accessible.org/automated-scans-wcag/
  type: analysis
  accessed: '2026-03-27'
  sections_used:
  - '13% of 55 WCAG 2.1 AA criteria: mostly accurate automated detection'
  - 45% partially detectable
  - 42% cannot be detected by automation
- name: 'WebAIM Screen Reader Survey #10 (2024)'
  url: https://webaim.org/projects/screenreadersurvey10/
  type: survey
  accessed: '2026-03-27'
  sections_used:
  - Desktop screen reader market share (JAWS 40.5%, NVDA 37.7%, VoiceOver 9.7%)
  - Browser + screen reader combinations
  - Mobile usage statistics (91.3% use SR on mobile)
  - Heading navigation as primary strategy (71.6%)
  - Free SR perceived as viable (78.1%)
