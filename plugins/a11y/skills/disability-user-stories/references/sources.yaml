# Sources for disability-user-stories skill
# All claims in SKILL.md and references are traceable to these sources.

persona_frameworks:
  - id: w3c-wai-user-stories
    title: "How People with Disabilities Use the Web: User Stories"
    url: https://www.w3.org/WAI/people-use-web/user-stories/
    publisher: W3C WAI
    used_for: "W3C WAI personas (Ade, Ian, Lakshmi, Lexie, Sophie, Dhruv, Marta, Stefan, Elias)"

  - id: gds-persona-profiles
    title: "Using persona profiles to test accessibility"
    url: https://accessibility.blog.gov.uk/2019/02/11/using-persona-profiles-to-test-accessibility/
    publisher: GOV.UK Government Digital Service
    date: 2019-02-11
    used_for: "GOV.UK accessibility personas, 50-minute session method, simulation caveat"

  - id: govuk-accessibility-personas
    title: "Accessibility Personas"
    url: https://alphagov.github.io/accessibility-personas/
    publisher: GOV.UK Alpha
    used_for: "Chrome browser profile simulations for persona testing"

  - id: gds-remote-persona-testing
    title: "Remote accessibility persona testing"
    url: https://accessibility.blog.gov.uk/2021/03/30/remote-accessibility-persona-testing/
    publisher: GOV.UK Government Digital Service
    date: 2021-03-30
    used_for: "Remote Chrome profile persona testing method"

  - id: microsoft-inclusive-design
    title: "Microsoft Inclusive Design"
    url: https://inclusive.microsoft.design/
    publisher: Microsoft
    used_for: "Persona spectrum (permanent/temporary/situational), three principles, disability-as-mismatch framing"

  - id: ux-booth-persona-spectrums
    title: "Persona Spectrums: Building for Inclusion and Accessibility"
    url: https://uxbooth.com/articles/persona-spectrums-building-for-inclusion-and-accessibility/
    publisher: UX Booth
    used_for: "Persona spectrum examples, cascading benefits framing"

  - id: dubbot-personas
    title: "Personas: A Human-Centered Approach to Accessibility"
    url: https://dubbot.com/dubblog/2025/personas-a-human-centered-approach-to-accessibility.html
    publisher: DubBot
    date: 2025
    used_for: "Custom persona building guidelines, positive framing, AT specificity"

user_stories:
  - id: section508-user-stories
    title: "Develop Accessible User Stories"
    url: https://www.section508.gov/develop/user-stories/
    publisher: Section 508 / GSA
    used_for: "Example stories by disability category (vision, keyboard, hearing, cognitive, motor, photosensitive)"

  - id: tetralogical-user-stories
    title: "How to write user stories for accessibility"
    url: https://tetralogical.com/blog/2022/05/26/how-to-write-user-stories-for-accessibility/
    publisher: TetraLogical
    date: 2022-05-26
    used_for: "Story template, experience-focused vs code-focused criteria, AT verification approach"

  - id: tpgi-user-stories
    title: "How to Write User Stories for Accessibility Requirements"
    url: https://www.tpgi.com/how-write-user-stories-accessibility-requirements/
    publisher: TPGi
    used_for: "User story patterns, acceptance criteria that verify AT experience"

  - id: accessibility-com-user-stories
    title: "Developing Accessible User Stories"
    url: https://www.accessibility.com/blog/developing-accessible-user-stories
    publisher: Accessibility.com
    used_for: "Story development process"

acceptance_criteria:
  - id: cerovac-acceptance-criteria
    title: "Acceptance criteria and accessibility"
    url: https://cerovac.com/a11y/2020/10/acceptance-criteria-and-accessibility/
    publisher: Bogdan Cerovac
    date: 2020-10
