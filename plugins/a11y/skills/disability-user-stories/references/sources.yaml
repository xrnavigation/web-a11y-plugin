    used_for: "Top frustrations (CAPTCHA, ambiguous links, unexpected changes), heading navigation stat (71.6%), accessibility perception trends"

  - id: allyant-blind-user
    title: "My Experience of Navigating the Web as a Blind User"
    url: https://allyant.com/blog/my-experience-of-navigating-the-web-as-a-blind-user/
    publisher: Allyant
    used_for: "Screen reader user quotes, quick abandonment triggers, overlay interruption experience"

  - id: usablenet-honest-take
    title: "A Screen Reader User's Honest Take"
    url: https://blog.usablenet.com/a-screen-reader-users-honest-take
    publisher: UsableNet
    used_for: "Emotional impact quotes, trepidation in digital tasks, travel booking abandonment"

  - id: audioeye-dhh
    title: "Digital Accessibility for Deaf and Hard of Hearing"
    url: https://www.audioeye.com/post/digital-accessibility-deaf-hard-of-hearing/
    publisher: AudioEye
    used_for: "Deaf user frustrations, mental health impact statistic"

testing:
  - id: accessible-org-automated
