  - id: canaxess-coles-aac
    title: "Accessibility Acceptance Criteria"
    url: https://www.canaxess.com.au/articles/accessibility-acceptance-criteria/
    publisher: CANAXESS / Coles Supermarket
    used_for: "10 critical AACs, Given-When-Then format, progress-over-perfection approach"

  - id: accessibility-for-teams-dod
    title: "Accessibility in the Definition of Done"
    url: https://accessibility-for-teams.com/article/accessibility-in-the-definition-of-done
    publisher: Accessibility for Teams
    used_for: "Four-item DoD checklist (automated testing, manual review, statement, content guide)"

bdd_gherkin:
  - id: hassell-gherkin
    title: "Gherkin accessibility tests"
    url: https://www.hassellinclusion.com/blog/gherkin-accessibility-tests/
    publisher: Hassell Inclusion
    used_for: "When to use Gherkin for accessibility, behavior vs markup rule of thumb"

  - id: accessibility-gherkin-github
    title: "accessibility-gherkin"
    url: https://github.com/bshack/accessibility-gherkin
    publisher: GitHub (bshack)
    used_for: "Gherkin scenario examples for accessibility"

shift_left:
  - id: iapm-shift-left
    title: "Shift-Left Accessibility"
    url: https://www.iapm.net/en/blog/shift-left-accessibility/
    publisher: IAPM
